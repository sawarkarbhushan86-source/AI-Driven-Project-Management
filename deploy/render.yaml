services:
  # FastAPI Backend Service
  - type: web
    name: ai-pmp-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        fromDatabase:
          name: ai-pmp-postgres
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

  # React Frontend Static Site
  - type: web
    name: ai-pmp-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: ai-pmp-postgres
    region: oregon
    plan: free
    postgresMajorVersion: 16